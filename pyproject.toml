[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mouse-hub"
version = "1.1.0"
description = "Controlador nativo do Logitech G403 HERO para Linux: DPI, sensibilidade e perfis via protocolo HID++."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["logitech", "g403", "dpi", "linux", "mint"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    # Emissão nativa de input (XTest/XRecord) e leitura do título da
    # janela ativa (Xlib) — usada pelo engine de automação e pelas
    # consultas de foco. Dependência de produção, não de CI.
    "python-xlib>=0.17",
    "PyQt5>=5.15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["mouse_hub*", "app*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
