name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint de sintaxe e testes de unidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar sintaxe/imports de todo o repositório
        run: python3 -m compileall -q mouse_hub tests mouse_hub.py app && python3 -c "import mouse_hub.core, mouse_hub.platform.linux"

      - name: Instalar dependências de teste
        run: python3 -m pip install --user -e ".[dev]"

      - name: Rodar suíte de testes (sem hardware)
        run: python3 -m pytest
