name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "feat/*"]

jobs:
  test:
    name: Lint de sintaxe e testes determinísticos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar sintaxe/imports de todo o repositório
        run: python3 -m compileall -q mouse_hub tests app && python3 -c "import mouse_hub.core, mouse_hub.platform.linux"

      - name: Instalar dependências de teste
        run: python3 -m pip install --user -e ".[dev]" PyQt5==5.15.11

      - name: Rodar suíte de testes determinísticos (sem hardware)
        run: QT_QPA_PLATFORM=offscreen python3 -m pytest tests/

      - name: Benchmark mínimo (startup, idle, CPS) — versão encurtada do CI
        run: QT_QPA_PLATFORM=offscreen BENCH_IDLE_SECONDS=10 BENCH_ACTIVE_SECONDS=5 python3 -m unittest tests.bench_perf -v

      - name: Benchmarks complementares (cold startup e gravação)
        run: QT_QPA_PLATFORM=offscreen python3 -m unittest tests.bench_cold_startup tests.bench_recording -v

  ui_smoke:
    name: Smoke da UI (Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências de teste
        run: python3 -m pip install --user -e ".[dev]" PyQt5==5.15.11

      - name: Smoke da janela principal com display virtual
        run: QT_QPA_PLATFORM=offscreen xvfb-run -a python3 -m unittest tests.smoke_ui_init

  deb_package:
    name: Pacote .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Montar staging e empacotar (determinístico, sem sudo)
        run: |
          packaging/deb/build_deb.sh
          dpkg-deb --info dist/mouse-hub_*_all.deb

      - name: Instalar o pacote em ambiente limpo e verificar árvore
        run: |
          # instala as dependências DECLARADAS no control — valida a
          # lista de Depends de verdade (e o postinst roda nelas)
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyqt5 python3-xlib x11-utils
          sudo dpkg -i dist/mouse-hub_*_all.deb
          test -x /usr/bin/mouse-hub
          test -f /usr/share/applications/mouse-hub.desktop
          test -f /etc/udev/rules.d/99-logitech-g403-hidraw.rules
          test -f /opt/mouse-hub/app/mouse_hub_app.py
          dpkg -s mouse-hub | grep "^Version:"

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: mouse-hub-deb
          path: dist/mouse-hub_*_all.deb
          if-no-files-found: error
